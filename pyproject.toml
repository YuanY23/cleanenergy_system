[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-carbon-park"
version = "0.1.0"
description = "Zero carbon park electric-heat-hydrogen-storage optimization simulation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyomo>=6.8",
    "highspy>=1.7",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "cdsapi>=0.7",
    "pvlib>=0.11",
    "xarray>=2024.6",
    "netcdf4>=1.7",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
zero-carbon-park = "zero_carbon_park.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
